name: animal_rescue_app
display_name: Animal-R
description: A mobile-first emergency animal rescue and adoption platform using geo-based visibility
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Navigation
  go_router: ^17.0.0
  
  # UI
  material_color_utilities: ^0.11.1
  
  # HTTP & API
  dio: ^5.4.0
  json_annotation: ^4.8.1
  
  # Location
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  geocoding: ^3.0.0
  
  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.2.4
  
  # Camera & Image
  camera: ^0.11.2+1
  image_picker: ^1.0.4
  
  # Storage
  shared_preferences: ^2.2.2
  
  # Utils
  uuid: ^4.2.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  
  # Code Generation
  build_runner: ^2.5.4
  riverpod_generator: ^2.6.5
  json_serializable: ^6.9.5

dependency_overrides:
  material_color_utilities: 0.5.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
